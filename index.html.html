function login(){const n=$('#n').value.trim().toLowerCase(),p=$('#p').value,t=D.tries[n]||{c:0};
if(t.u>Date.now()){msg=['er','Trop d’essais. Accès bloqué pendant 15 minutes.'];R();return false}
const c=($('#c')||{value:''}).value.trim(),u=D.users.find(x=>x.n==n&&x.actif);if(u&&u.pw==p&&u.code==c){const pv=D.sess.filter(s=>s.n==n).pop(),fl=pv?D.log.filter(l=>l.t>pv.q&&l.a=='connexion échouée : '+n).length:0;delete D.tries[n];D.sess.forEach(s=>{if(s.n==n)s.out=1});D.sess.push({n,q:Date.now(),last:Date.now(),out:0});D.sess=D.sess.slice(-60);U={n,r:u.r,ag:u.ag};log('connexion');save();msg=['ok',pv?`Dernière connexion : ${new Date(pv.q).toLocaleString('fr-FR')}.${fl?` ${fl} tentative(s) échouée(s) sur votre compte depuis.`:''}`:'Première connexion.'];go('dash');return false}
t.c=(t.u&&t.u<=Date.now()?0:t.c)+1;if(t.c>=3){t.u=Date.now()+9e5;msg=['er','Trop d’essais. Accès bloqué pendant 15 minutes.']}else msg=['er',`Nom d’utilisateur ou mot de passe incorrect. Il vous reste ${3-t.c} essai(s).`];D.tries[n]=t;log('connexion échouée : '+n.slice(0,30));save();R();return false}

function sub(e,key){const E=EN[e],fd=new FormData($('#f')),ex=key?find(e,key):null,o={},er=[];
E.f.forEach(([k,l,t,rq,x])=>{if(ex&&E.k.includes(k)){o[k]=ex[k];return}let v=(fd.get(k)||'').trim();if(k=='ag'&&U.ag&&U.r!='admin'&&e!='part')v=U.ag;
if(!v){if(rq)er.push(`« ${l} » est obligatoire.`);o[k]='';return}
if(t=='d'&&(v>TD||v<'1930'))er.push(`« ${l} » : date invalide ou dans le futur.`);
if(t=='h'&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(v))er.push(`« ${l} » : heure invalide.`);
if(k=='ta'&&!/^\d{2,3}\/\d{2,3}$/.test(v))er.push(`« ${l} » : format attendu 120/80.`);
if(t=='f'&&v<TD&&!(ex&&ex[k]==v))er.push(`« ${l} » ne peut pas être dans le passé.`);
if(t=='n'){const n=+v.replace(',','.');if(isNaN(n)||n<x[0]||n>x[1])er.push(`« ${l} » doit être entre ${x[0]} et ${x[1]}.`);else v=n}
if(t=='t'&&v.length>(k=='num'?7:60))er.push(`« ${l} » : ${k=='num'?7:60} caractères au maximum.`);o[k]=v});
if(!ex&&!E.auto){const d=D[e].find(r=>E.k.every(k=>r[k]==o[k]));if(d)er.push(e=='pat'?`Doublon : la fiche n° ${o.num} existe déjà (patiente ${d.nom} ${d.post}).`:'Doublon : cet enregistrement existe déjà.')}
if(er.length){go('form',e,key,o,er);return false}
if(ex)Object.assign(ex,o);else{if(E.auto)o.id=E.auto();D[e].push(o)}
log((ex?'modification ':'création ')+e+' '+keyOf(E,ex||o));save();msg=['ok',ex?'Modification réussie.':'Enregistrement réussi.'];go('list',e);return false}
function del(e,key){const r=find(e,key);if(deps(e,r)){msg=['er','Suppression impossible : cet élément est utilisé ailleurs (consultations, séances, accouchements…). Supprimez d’abord les enregistrements liés.'];R();return}
if(!confirm('Supprimer définitivement cet enregistrement ?'))return;D[e].splice(D[e].indexOf(r),1);log('suppression '+e+' '+key);save();msg=['ok','Enregistrement supprimé.'];R()}
function copy(){const t=$('#bk');(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>{msg=['ok','Copie placée dans le presse-papiers.'];R()},()=>t.select())}
function restore(){let x;try{x=JSON.parse($('#bk').value);if(!x.pat||!x.sea||!x.acc||!x.cons)throw 0}catch(e){msg=['er','Sauvegarde invalide : le texte n’est pas une copie complète.'];R();return}if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?'))return;D=x;if(!D.cfg)D.cfg={taux:2800,hist:[]};log('restauration');save();msg=['ok','Données restaurées.'];go('menu')}
function rap(id){const s=D.sea.find(x=>x.id==id);s.rap=TD;log('rappel rendez-vous F'+pad(id,4));save();msg=['ok','Rappel enregistré.'];R()}
function uc(){const fd=new FormData($('#uf')),n=(fd.get('n')||'').trim().toLowerCase(),r=fd.get('r'),ag=fd.get('ag')||'',p=fd.get('p')||'',e=m=>{msg=['er',m];R();return false};
if(!/^[a-z0-9_.-]{3,30}$/.test(n))return e('Nom d’utilisateur : 3 à 30 caractères (lettres minuscules, chiffres, . _ -).');
if(D.users.some(u=>u.n==n))return e('Ce nom d’utilisateur existe déjà.');
if(p.length<8)return e('Mot de passe : 8 caractères minimum.');
if(['consultation','accouchement'].includes(r)&&!ag)return e('Choisissez l’agent lié à ce compte (médecin ou nursing).');
const code=gen();D.users.push({n,r,ag,pw:p,code,actif:1});log('utilisateur créé '+n);save();msg=['ok',`Utilisateur créé : ${n}. Code personnel : ${code} (à noter maintenant)`];R();return false}
function ua(i,a){const u=D.users[i];if(a=='act'){u.actif=u.actif?0:1;msg=['ok','Statut du compte modifié.']}else if(a=='unb'){delete D.tries[u.n];msg=['ok','Compte débloqué.']}else if(a=='code'){u.code=gen();msg=['ok',`Nouveau code personnel de ${u.n} : ${u.code} (à noter maintenant)`]}else{u.pw='Tmp'+Math.random().toString(36).slice(2,8);msg=['ok',`Nouveau mot de passe de ${u.n} : ${u.pw} (à noter maintenant)`]}log('utilisateur '+a+' '+u.n);save();R()}
function stx(){if(!['admin','identification'].includes(U.r))return false;const t=+$('#tx').value.replace(',','.');if(isNaN(t)||t<100||t>100000){msg=['er','Le taux doit être un nombre entre 100 et 100 000 FC pour 1 $.'];R();return false}D.cfg.hist.unshift({q:new Date().toLocaleString('fr-FR'),u:U.n,t});D.cfg.hist=D.cfg.hist.slice(0,30);D.cfg.taux=t;log('taux de change '+t);save();msg=['ok','Taux enregistré : 1 $ = '+fc(t)+' FC.'];R();return false}
function csv(k){const h=ET[k][1]();const s=[h[0],...h[1]].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>{msg=['ok','Tableau copié : collez-le dans Excel.'];R()},()=>{msg=['er','Copie impossible dans ce navigateur.'];R()})}
const tick=()=>{const c=$('#clk');if(c)c.textContent=new Date().toLocaleString(lang=='fr'?'fr-FR':'en-GB',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'})};setInterval(tick,1000);
const idle=()=>{clearTimeout(it);if(U)it=setTimeout(()=>{log('déconnexion automatique');endS();U=null;msg=['er','Session fermée après 10 minutes d’inactivité.'];go('login')},6e5)};['click','keydown'].forEach(e=>document.addEventListener(e,idle));
load();R();
